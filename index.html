<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UrnaLab · Simulador Eleitoral Mundial</title>
<style>
:root {
  --bg: #080c14;
  --bg-elev: #0f1624;
  --bg-card: #141d2e;
  --bg-hover: #1b273d;
  --border: rgba(148, 163, 184, 0.16);
  --border-strong: rgba(148, 163, 184, 0.30);
  --text: #f1f5f9;
  --text-dim: #94a3b8;
  --text-muted: #64748b;
  --accent: #38bdf8;
  --accent-soft: rgba(56, 189, 248, 0.14);
  --uncounted: #1e293b;
  --map-stroke: rgba(15, 23, 42, 0.85);
  --map-bg: #070b12;
  --ok: #10b981;
  --warn: #f59e0b;
  --danger: #ef4444;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
body.light {
  --bg: #f1f5f9;
  --bg-elev: #ffffff;
  --bg-card: #f8fafc;
  --bg-hover: #e2e8f0;
  --border: rgba(15, 23, 42, 0.12);
  --border-strong: rgba(15, 23, 42, 0.25);
  --text: #0f172a;
  --text-dim: #475569;
  --text-muted: #64748b;
  --accent: #0284c7;
  --accent-soft: rgba(2, 132, 199, 0.12);
  --uncounted: #cbd5e1;
  --map-stroke: rgba(255, 255, 255, 0.9);
  --map-bg: #e2e8f0;
  --shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 13px; line-height: 1.4;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.app-shell { display: flex; flex-direction: column; min-height: 100vh; }
.topbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 16px; background: var(--bg-elev);
  border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 9px; margin-right: 6px; }
.brand-logo {
  width: 30px; height: 30px; border-radius: 8px;
  background: linear-gradient(135deg, #2563eb, #06b6d4);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 2px 10px rgba(37, 99, 235, 0.4); flex-shrink: 0;
}
.brand-title { font-weight: 800; font-size: 15px; letter-spacing: -0.02em; }
.brand-sub { font-size: 11px; color: var(--text-dim); margin-top: -1px; }
.top-controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; flex: 1; }
.ctrl-group {
  display: flex; align-items: center; gap: 6px;
  background: var(--bg-card); border: 1px solid var(--border);
  padding: 4px 8px; border-radius: 8px;
}
.ctrl-group label {
  font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em;
}
select.styled, input.styled {
  background: var(--bg-elev); color: var(--text);
  border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; outline: none;
}
select.styled:focus, input.styled:focus { border-color: var(--accent); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  padding: 6px 10px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-card);
  font-weight: 600; font-size: 12px; transition: all 0.14s ease; white-space: nowrap;
}
.btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.btn.primary { background: #2563eb; border-color: #3b82f6; color: #fff; }
.btn.primary:hover { background: #1d4ed8; }
.btn.success { background: #059669; border-color: #10b981; color: #fff; }
.btn.success:hover { background: #047857; }
.btn.danger { background: rgba(239, 68, 68, 0.14); border-color: rgba(239, 68, 68, 0.4); color: #f87171; }
.btn.active { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.sm { padding: 4px 8px; font-size: 11.5px; border-radius: 6px; }
.country-ribbon {
  display: flex; align-items: center; gap: 6px; padding: 7px 16px;
  background: var(--bg); border-bottom: 1px solid var(--border);
  overflow-x: auto; scrollbar-width: thin;
}
.country-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px; cursor: pointer;
  border: 1px solid var(--border); background: var(--bg-elev);
  font-size: 12px; font-weight: 600; color: var(--text-dim);
  flex-shrink: 0; transition: all 0.12s;
}
.country-pill:hover { color: var(--text); border-color: var(--border-strong); }
.country-pill.active { background: var(--accent-soft); border-color: var(--accent); color: var(--text); }
.country-code {
  font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px;
  background: rgba(148, 163, 184, 0.18); color: var(--text);
}
.scoreboard {
  padding: 10px 16px; background: var(--bg-elev);
  border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px;
}
.score-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.race-title-wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.race-title { font-size: 16px; font-weight: 800; letter-spacing: -0.015em; }
.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text-dim);
}
.badge.live { background: rgba(239, 68, 68, 0.16); border-color: rgba(239, 68, 68, 0.45); color: #f87171; }
.badge.done { background: rgba(16, 185, 129, 0.14); border-color: rgba(16, 185, 129, 0.4); color: #34d399; }
.dot-pulse { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; animation: pulse 1.1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.75); } }
.score-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; font-size: 12px; color: var(--text-dim); }
.score-meta strong { color: var(--text); }
.party-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.p-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 9px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px;
  position: relative; overflow: hidden;
}
.p-card.winner { border-color: var(--accent); box-shadow: inset 0 0 0 1px rgba(56, 189, 248, 0.25); }
.p-stripe { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
.p-head { display: flex; align-items: center; justify-content: space-between; gap: 6px; padding-left: 6px; }
.p-name { font-weight: 700; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.p-tag { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 4px; color: #fff; flex-shrink: 0; }
.p-main { display: flex; align-items: baseline; justify-content: space-between; padding-left: 6px; }
.p-big { font-size: 19px; font-weight: 800; letter-spacing: -0.02em; }
.p-sub { font-size: 11px; color: var(--text-dim); }
.progress-track {
  position: relative; height: 14px; border-radius: 7px; overflow: hidden;
  background: var(--uncounted); display: flex; border: 1px solid var(--border);
}
.progress-seg { height: 100%; transition: width 0.12s linear; }
.thresh-line {
  position: absolute; top: 0; bottom: 0; width: 2px; background: #ffffff;
  box-shadow: 0 0 6px rgba(0, 0, 0, 0.8); z-index: 3; pointer-events: none;
}
.workspace {
  display: grid; grid-template-columns: minmax(0, 1.58fr) minmax(350px, 1fr);
  gap: 12px; padding: 12px 16px 18px; flex: 1;
}
@media (max-width: 1080px) { .workspace { grid-template-columns: 1fr; } }
.panel {
  background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  box-shadow: var(--shadow);
}
.map-toolbar {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px;
  padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg-card);
}
.toolbar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.map-viewport {
  position: relative; background: var(--map-bg);
  flex: 1; min-height: 440px; aspect-ratio: 16 / 10; max-height: 580px; overflow: hidden; user-select: none; touch-action: none;
}
.map-svg { width: 100%; height: 100%; display: block; }
.unit-path {
  stroke: var(--map-stroke); stroke-width: 0.75; stroke-linejoin: round;
  cursor: pointer; transition: fill 0.14s ease, opacity 0.14s ease;
}
.unit-path:hover { filter: brightness(1.16); stroke-width: 1.5; stroke: #ffffff; }
.unit-path.selected { stroke: #facc15; stroke-width: 2.1; }
.unit-path.flash { animation: regionFlash 0.65s ease; }
@keyframes regionFlash { 0% { filter: brightness(1.65); } 100% { filter: brightness(1); } }
.inset-frame {
  fill: rgba(15, 23, 42, 0.45); stroke: var(--border-strong);
  stroke-width: 1; stroke-dasharray: 3 3; rx: 6;
}
body.light .inset-frame { fill: rgba(255, 255, 255, 0.65); }
.inset-title { font-size: 10px; font-weight: 700; fill: var(--text-dim); pointer-events: none; }
.callout-line { stroke: var(--text-muted); stroke-width: 0.9; opacity: 0.7; pointer-events: none; }
.callout-pill rect { stroke: var(--map-stroke); stroke-width: 1; cursor: pointer; rx: 4; }
.callout-pill text {
  font-size: 9.5px; font-weight: 800; fill: #fff; text-anchor: middle; dominant-baseline: central;
  pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,0.8);
}
.callout-pill.selected rect { stroke: #facc15; stroke-width: 2; }
.map-label {
  font-size: 9px; font-weight: 800; fill: #ffffff; text-anchor: middle; dominant-baseline: central;
  pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,0.65); stroke-width: 2.2px;
}
.map-legend {
  position: absolute; left: 12px; bottom: 12px;
  background: rgba(15, 23, 42, 0.86); backdrop-filter: blur(8px);
  border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 10px; font-size: 11px; color: #e2e8f0;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  max-width: calc(100% - 24px);
}
body.light .map-legend { background: rgba(255, 255, 255, 0.92); color: #0f172a; }
.swing-bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding: 8px 12px; border-top: 1px solid var(--border); background: var(--bg-card); font-size: 12px;
}
.hemi-wrap {
  padding: 6px 12px 10px; border-top: 1px solid var(--border);
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
  background: var(--bg-elev);
}
.tooltip {
  position: fixed; z-index: 90; pointer-events: none;
  background: rgba(10, 15, 26, 0.96); color: #f8fafc;
  border: 1px solid rgba(148, 163, 184, 0.35); border-radius: 9px;
  padding: 9px 11px; min-width: 220px; max-width: 290px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.55); font-size: 12px; display: none;
}
body.light .tooltip { background: rgba(255, 255, 255, 0.97); color: #0f172a; }
.tt-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 5px; font-weight: 800; }
.tt-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; font-size: 11.5px; }
.tt-bar { height: 4px; border-radius: 2px; margin-top: 2px; }
.tabs-nav { display: flex; border-bottom: 1px solid var(--border); background: var(--bg-card); }
.tab-btn {
  flex: 1; padding: 10px 8px; border: none; background: transparent;
  cursor: pointer; font-weight: 700; font-size: 12px; color: var(--text-dim);
  border-bottom: 2px solid transparent; transition: all 0.14s;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: var(--bg-elev); }
.tab-body { padding: 12px; overflow-y: auto; max-height: 680px; display: flex; flex-direction: column; gap: 12px; }
.card-box {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 9px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
}
.card-title { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center; }
.sim-transport { display: flex; flex-wrap: wrap; gap: 6px; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.field { display: flex; flex-direction: column; gap: 3px; }
.field label { font-size: 11px; color: var(--text-dim); font-weight: 600; }
.event-log { max-height: 185px; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; font-size: 11.5px; }
.ev-item {
  padding: 5px 8px; border-radius: 6px; background: var(--bg-elev); border: 1px solid var(--border);
  display: flex; justify-content: space-between; gap: 8px;
}
.ev-flip { border-left: 3px solid #f59e0b; }
.ev-call { border-left: 3px solid #10b981; }
.edit-row { display: grid; grid-template-columns: 14px minmax(85px, 1fr) 92px 62px; gap: 6px; align-items: center; }
.edit-row input {
  width: 100%; background: var(--bg-elev); border: 1px solid var(--border);
  border-radius: 5px; padding: 4px 6px; text-align: right; font-size: 12px;
}
.swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; }
.table-wrap { overflow: auto; max-height: 520px; border: 1px solid var(--border); border-radius: 8px; }
table.data-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; }
table.data-tbl th {
  position: sticky; top: 0; background: var(--bg-card); text-align: left;
  padding: 7px 8px; border-bottom: 1px solid var(--border); cursor: pointer;
  font-weight: 700; color: var(--text-dim); white-space: nowrap;
}
table.data-tbl td { padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
table.data-tbl tr:hover td { background: var(--bg-hover); cursor: pointer; }
table.data-tbl tr.active-row td { background: var(--accent-soft); }
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.68); z-index: 100;
  display: none; align-items: center; justify-content: center; padding: 16px;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--bg-elev); border: 1px solid var(--border-strong);
  border-radius: 12px; width: min(560px, 100%); padding: 16px;
  display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow);
}
textarea.json-box {
  width: 100%; min-height: 200px; background: var(--bg-card); color: var(--text);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px;
}
</style>
</head>
<body>
<div class="app-shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2">
          <rect x="3" y="8" width="18" height="12" rx="2"></rect>
          <path d="M7 8V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v3"></path>
          <path d="M8 14l2.5 2.5L16 11"></path>
        </svg>
      </div>
      <div>
        <div class="brand-title">UrnaLab</div>
        <div class="brand-sub" data-i18n="subtitle">Simulador Eleitoral Mundial</div>
      </div>
    </div>
    <div class="top-controls">
      <div class="ctrl-group">
        <label data-i18n="lblMap">Mapa</label>
        <select id="mapSelect" class="styled"></select>
      </div>
      <div class="ctrl-group">
        <label data-i18n="lblPreset">Eleição</label>
        <select id="presetSelect" class="styled"></select>
      </div>
      <button class="btn sm" id="btnBlankMap" data-i18n="btnBlank">Mapa em Branco</button>
      <button class="btn sm" id="btnResetPreset" data-i18n="btnRestore">Restaurar Real</button>
      <button class="btn sm" id="btnIoModal" data-i18n="btnJson">JSON</button>
      <button class="btn sm" id="btnLang">PT / EN</button>
      <button class="btn sm" id="btnTheme" data-i18n="btnTheme">Tema</button>
    </div>
  </header>

  <nav class="country-ribbon" id="countryRibbon"></nav>

  <section class="scoreboard">
    <div class="score-top">
      <div class="race-title-wrap">
        <span class="race-title" id="raceTitle"></span>
        <span class="badge" id="systemBadge"></span>
        <span class="badge" id="statusBadge"></span>
      </div>
      <div class="score-meta" id="scoreMeta"></div>
    </div>
    <div class="party-cards" id="partyCards"></div>
    <div class="progress-track" id="overallTrack"></div>
  </section>

  <main class="workspace">
    <section class="panel">
      <div class="map-toolbar">
        <div class="toolbar-row">
          <button class="btn sm active" id="toolInspect" data-i18n="toolInspect">Inspecionar / Editar</button>
          <button class="btn sm" id="toolPaint" data-i18n="toolPaint">Pincel no Mapa</button>
          <select id="paintPartySelect" class="styled" style="display:none;"></select>
          <select id="paintModeSelect" class="styled" style="display:none;">
            <option value="win">Vitória (65%)</option>
            <option value="landslide">Maioria Ampla (80%)</option>
            <option value="boost">+10% Swing</option>
          </select>
        </div>
        <div class="toolbar-row">
          <select id="colorModeSelect" class="styled">
            <option value="margin" data-i18n="modeMargin">Cor por Margem</option>
            <option value="solid" data-i18n="modeSolid">Cor Sólida</option>
            <option value="turnout" data-i18n="modeTurnout">Volume de Votos</option>
          </select>
          <button class="btn sm active" id="btnLabels" data-i18n="btnLabels">Siglas</button>
          <button class="btn sm" id="btnZoomIn">+</button>
          <button class="btn sm" id="btnZoomOut">-</button>
          <button class="btn sm" id="btnZoomReset" data-i18n="btnFit">Ajustar</button>
        </div>
      </div>

      <div class="map-viewport" id="mapViewport">
        <svg id="mapSvg" class="map-svg" viewBox="0 0 960 600" preserveAspectRatio="xMidYMid meet">
          <g id="mapPanGroup"></g>
        </svg>
        <div class="map-legend" id="mapLegend"></div>
      </div>

      <div class="swing-bar">
        <strong data-i18n="swingTitle">Swing Global:</strong>
        <select id="swingPartySelect" class="styled"></select>
        <input type="range" id="swingSlider" min="-25" max="25" step="0.5" value="0" style="width:150px;">
        <span class="num" id="swingValLabel" style="min-width:52px;font-weight:700;">0.0%</span>
        <button class="btn sm" id="btnApplySwing" data-i18n="btnApplySwing">Fixar Swing</button>
        <button class="btn sm" id="btnResetSwing" data-i18n="btnResetSwing">Zerar Swing</button>
      </div>

      <div class="hemi-wrap" id="hemiWrap">
        <div style="display:flex;align-items:center;gap:12px;">
          <svg id="hemiSvg" width="210" height="110" viewBox="0 0 210 110"></svg>
          <div>
            <div style="font-weight:800;font-size:13px;" id="hemiTitle"></div>
            <div style="font-size:11.5px;color:var(--text-dim);" id="hemiSub"></div>
          </div>
        </div>
        <div id="hemiBreakdown" style="display:flex;flex-wrap:wrap;gap:8px;font-size:11.5px;"></div>
      </div>
    </section>

    <aside class="panel">
      <div class="tabs-nav">
        <button class="tab-btn active" data-tab="sim" data-i18n="tabSim">Apuração</button>
        <button class="tab-btn" data-tab="edit" data-i18n="tabEdit">Região</button>
        <button class="tab-btn" data-tab="table" data-i18n="tabTable">Tabela</button>
        <button class="tab-btn" data-tab="parties" data-i18n="tabParties">Partidos</button>
      </div>

      <div class="tab-body" id="tabSim">
        <div class="card-box">
          <div class="card-title">
            <span data-i18n="simTitle">Apuração Cronometrada (Urnas ao Vivo)</span>
            <span class="num" id="simPctText" style="color:var(--accent);">100.0%</span>
          </div>
          <div class="sim-transport">
            <button class="btn success" id="btnSimStart" data-i18n="simStart">Iniciar do Zero</button>
            <button class="btn primary" id="btnSimToggle" data-i18n="simPause">Pausar</button>
            <button class="btn" id="btnSimZero" data-i18n="simZero">0%</button>
            <button class="btn" id="btnSimDone" data-i18n="simFinish">100%</button>
          </div>
          <div class="field">
            <label data-i18n="simScrub">Linha do Tempo da Apuração</label>
            <input type="range" id="simScrub" min="0" max="1000" value="1000">
          </div>
          <div class="grid-2">
            <div class="field">
              <label data-i18n="simDur">Duração (segundos)</label>
              <div style="display:flex;gap:4px;">
                <select id="simDurPreset" class="styled" style="flex:1;">
                  <option value="10">10s (Flash)</option>
                  <option value="20">20s (Rápido)</option>
                  <option value="30" selected>30s (Padrão)</option>
                  <option value="60">60s (Suspense)</option>
                  <option value="120">2 min</option>
                  <option value="300">5 min</option>
                </select>
                <input type="number" id="simDurCustom" class="styled num" min="3" max="3600" value="30" style="width:62px;">
              </div>
            </div>
            <div class="field">
              <label data-i18n="simSpeed">Velocidade</label>

function t(k) { return (I18N[state.lang] && I18N[state.lang][k]) || k; }
function fmtInt(n) { return Math.round(n || 0).toLocaleString(state.lang === 'pt' ? 'pt-BR' : 'en-US'); }
function fmtPct(v) { return (v || 0).toFixed(2).replace('.', state.lang === 'pt' ? ',' : '.') + '%'; }
function clamp(x, a, b) { return Math.max(a, Math.min(b, x)); }
function smoothstep(x) { return x * x * (3 - 2 * x); }

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0) / 4294967295;
}

function hexToRgb(hex) {
  const m = new RegExp('^#?([a-f\\d]{2})([a-f\\d]{2})([a-f\\d]{2})$', 'i').exec(hex || '#64748b');
  return m ? [parseInt(m[1], 16), parseInt(m[2], 16), parseInt(m[3], 16)] : [100, 116, 139];
}

function blendColor(hex, factor, bgHex) {
  const [r, g, b] = hexToRgb(hex);
  const [br, bg, bb] = hexToRgb(bgHex);
  const f = clamp(factor, 0, 1);
  return 'rgb(' + Math.round(br + (r - br) * f) + ',' + Math.round(bg + (g - bg) * f) + ',' + Math.round(bb + (b - bb) * f) + ')';
}

function cloneObj(o) { return JSON.parse(JSON.stringify(o)); }

function initSelectors() {
  const mapSel = document.getElementById('mapSelect');
  const ribbon = document.getElementById('countryRibbon');
  const groups = {};
  CATALOG.forEach(c => { (groups[c.group] = groups[c.group] || []).push(c); });
  mapSel.innerHTML = '';
  Object.keys(groups).forEach(g => {
    const og = document.createElement('optgroup');
    og.label = g;
    groups[g].forEach(c => {
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = (state.lang === 'pt' ? c.name : c.nameEn) + ' (' + MAPS[c.id].units.length + ')';
      og.appendChild(opt);
    });
    mapSel.appendChild(og);
  });
  ribbon.innerHTML = '';
  CATALOG.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'country-pill' + (c.id === state.mapId ? ' active' : '');
    btn.dataset.map = c.id;
    btn.innerHTML = '<span class="country-code">' + c.flag + '</span><span>' + (state.lang === 'pt' ? c.name : c.nameEn) + '</span>';
    btn.addEventListener('click', () => switchMap(c.id));
    ribbon.appendChild(btn);
  });
  mapSel.value = state.mapId;
  populatePresetSelect();
}

function populatePresetSelect() {
  const ps = document.getElementById('presetSelect');
  ps.innerHTML = '';
  Object.values(PRESETS).filter(p => p.map === state.mapId).forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.id;
    opt.textContent = state.lang === 'pt' ? p.name : (p.nameEn || p.name);
    ps.appendChild(opt);
  });
  const blankOpt = document.createElement('option');
  blankOpt.value = '__blank__';
  blankOpt.textContent = state.lang === 'pt' ? '+ Mapa em Branco (Personalizar)' : '+ Blank Map (Custom)';
  ps.appendChild(blankOpt);
  ps.value = state.presetId;
}

  state.mapId = mapId;
  const cat = CATALOG.find(c => c.id === mapId);
  state.presetId = cat.defaultPreset;
  state.selectedUnit = cat.defaultUnit;
  loadPreset(state.presetId);
  initSelectors();
  resetZoom();
}

function loadPreset(presetId) {
  stopSim();
  if (presetId === '__blank__') {
    createBlankScenario();
    return;
  }
  const src = PRESETS[presetId];
  state.presetId = presetId;
  state.scenario = cloneObj(src);
  state.origBaseline = cloneObj(src);
  Object.values(state.scenario.regions).forEach(r => { r.localProg = null; });
  state.swingDelta = 0;
  state.swingPartyIdx = 0;
  state.paintPartyIdx = 0;
  state.sim.progress = 1;
  state.sim.events = [];
  state.sim.prevWinners = {};
  state.sim.calledUnits = {};
  state.sim.majorityCalled = false;
  if (!state.scenario.regions[state.selectedUnit]) {
    state.selectedUnit = MAPS[state.mapId].units[0].id;
  }
  renderMapStructure();
  syncControlsToScenario();
  updateAll();
}

function createBlankScenario() {
  const base = PRESETS[CATALOG.find(c => c.id === state.mapId).defaultPreset];
  const sc = cloneObj(base);
  sc.id = '__blank__';
  sc.name = (state.lang === 'pt' ? 'Eleição Personalizada · ' : 'Custom Election · ') + (CATALOG.find(c => c.id === state.mapId).name);
  sc.nameEn = sc.name;
  delete sc.exemptParty;
  delete sc.exemptSeats;
  delete sc.nonThresholdParties;
  sc.parties = [
    { id: 'c1', name: state.lang === 'pt' ? 'Candidato / Partido A' : 'Candidate / Party A', short: 'PART A', color: '#2563EB' },
    { id: 'c2', name: state.lang === 'pt' ? 'Candidato / Partido B' : 'Candidate / Party B', short: 'PART B', color: '#DC2626' },
    { id: 'c3', name: state.lang === 'pt' ? 'Candidato / Partido C' : 'Candidate / Party C', short: 'PART C', color: '#10B981' }
  ];
  Object.keys(sc.regions).forEach(k => {
    const r = sc.regions[k];
    r.votes = [0, 0, 0];
    r.baseSeats = [0, 0, 0];
    r.bn = 0;
    r.abs = 0;
    r.localProg = null;
  });
  state.presetId = '__blank__';
  state.scenario = sc;
  state.origBaseline = cloneObj(sc);
  state.swingDelta = 0;
  state.sim.progress = 1;
  state.sim.events = [];
  renderMapStructure();
  syncControlsToScenario();
  updateAll();
}

function renderMapStructure() {
  const map = MAPS[state.mapId];
  const g = document.getElementById('mapPanGroup');
  g.innerHTML = '';
  pathById = {};
  calloutById = {};
  labelById = {};

  const insetLayer = document.createElementNS(SVG_NS, 'g');
  (map.insets || []).forEach(ins => {
    const r = document.createElementNS(SVG_NS, 'rect');
    r.setAttribute('x', ins.x); r.setAttribute('y', ins.y);
    r.setAttribute('width', ins.w); r.setAttribute('height', ins.h);
    r.setAttribute('class', 'inset-frame');
    insetLayer.appendChild(r);
    const tx = document.createElementNS(SVG_NS, 'text');
    tx.setAttribute('x', ins.x + 8); tx.setAttribute('y', ins.y + 14);
    tx.setAttribute('class', 'inset-title');
    tx.textContent = ins.label;
    insetLayer.appendChild(tx);
  });
  g.appendChild(insetLayer);

  const unitLayer = document.createElementNS(SVG_NS, 'g');
  const labelLayer = document.createElementNS(SVG_NS, 'g');

  map.units.forEach(u => {
    const path = document.createElementNS(SVG_NS, 'path');
    path.setAttribute('d', u.d);
    path.setAttribute('class', 'unit-path');
    path.dataset.id = u.id;
    path.addEventListener('pointerenter', e => showTooltip(u.id, e));
    path.addEventListener('pointermove', e => moveTooltip(e));
    path.addEventListener('pointerleave', () => hideTooltip());
    path.addEventListener('pointerdown', e => onUnitPointerDown(u.id, e));
    unitLayer.appendChild(path);
    pathById[u.id] = path;

    if (u.area > 350 && !u.inset) {
      const lbl = document.createElementNS(SVG_NS, 'text');
      lbl.setAttribute('x', u.cx);
      lbl.setAttribute('y', u.cy);
      lbl.setAttribute('class', 'map-label');
      lbl.textContent = u.short;
      labelLayer.appendChild(lbl);
      labelById[u.id] = lbl;
    }
  });
  g.appendChild(unitLayer);
  g.appendChild(labelLayer);

  const calloutLayer = document.createElementNS(SVG_NS, 'g');
  (map.callouts || []).forEach(c => {
    const u = map.units.find(x => x.id === c.id);
    if (!u) return;
    const line = document.createElementNS(SVG_NS, 'line');
    line.setAttribute('x1', u.cx); line.setAttribute('y1', u.cy);
    line.setAttribute('x2', c.x + c.w / 2); line.setAttribute('y2', c.y + c.h / 2);
    line.setAttribute('class', 'callout-line');
    calloutLayer.appendChild(line);

    const cg = document.createElementNS(SVG_NS, 'g');
    cg.setAttribute('class', 'callout-pill');
    const rect = document.createElementNS(SVG_NS, 'rect');
    rect.setAttribute('x', c.x); rect.setAttribute('y', c.y);
    rect.setAttribute('width', c.w); rect.setAttribute('height', c.h);
    rect.dataset.id = c.id;
    const tx = document.createElementNS(SVG_NS, 'text');
    tx.setAttribute('x', c.x + c.w / 2); tx.setAttribute('y', c.y + c.h / 2);
    tx.textContent = c.label || u.short;
    cg.appendChild(rect);
    cg.appendChild(tx);
    cg.addEventListener('pointerenter', e => showTooltip(c.id, e));
    cg.addEventListener('pointermove', e => moveTooltip(e));
    cg.addEventListener('pointerleave', () => hideTooltip());
    cg.addEventListener('pointerdown', e => onUnitPointerDown(c.id, e));
    calloutLayer.appendChild(cg);
    calloutById[c.id] = cg;
  });
  g.appendChild(calloutLayer);
  applyZoomTransform();
}

function getEffectiveTargetVotes(uid) {
  const r = state.scenario.regions[uid];
  const votes = r.votes.slice();
  const tot = votes.reduce((a, b) => a + b, 0);
  if (Math.abs(state.swingDelta) > 0.01 && tot > 0) {
    const idx = clamp(state.swingPartyIdx, 0, votes.length - 1);
    const curPct = (votes[idx] / tot) * 100;
    const newPct = clamp(curPct + state.swingDelta, 0, 100);
    const newMain = Math.round(tot * (newPct / 100));
    const remOld = tot - votes[idx];
    const remNew = Math.max(0, tot - newMain);
    for (let j = 0; j < votes.length; j++) {
      if (j === idx) {
        votes[j] = newMain;
      } else if (remOld > 0) {
        votes[j] = Math.round(votes[j] * (remNew / remOld));
      } else {
        votes[j] = Math.round(remNew / Math.max(1, votes.length - 1));
      }
    }
    const fix = tot - votes.reduce((a, b) => a + b, 0);
    if (votes.length > 0) votes[idx] = Math.max(0, votes[idx] + fix);
  }
  return votes;
}

function getCountedRegion(uid) {
  const sc = state.scenario;
  const r = sc.regions[uid];
  const target = getEffectiveTargetVotes(uid);
  const totTarget = target.reduce((a, b) => a + b, 0);
  let p = (r.localProg !== null && r.localProg !== undefined) ? clamp(r.localProg, 0, 1) : state.sim.progress;
  if (r.localProg === null || r.localProg === undefined) {
    const g = state.sim.progress;
    const curve = state.sim.curve;
    const w = r.wave || 0.5;
    if (g <= 0) p = 0;
    else if (g >= 1) p = 1;
    else if (curve === 'uniform') p = g;
    else if (curve === 'waves') {
      const t0 = clamp(w * 0.62, 0, 0.7);
      const t1 = Math.min(1, t0 + 0.34);
      p = smoothstep(clamp((g - t0) / (t1 - t0), 0, 1));
    } else if (curve === 'random') {
      const h1 = hashStr(uid + 'a');
      const h2 = hashStr(uid + 'b');
      const t0 = h1 * 0.58;
      const t1 = Math.min(1, t0 + 0.28 + h2 * 0.2);
      p = smoothstep(clamp((g - t0) / (t1 - t0), 0, 1));
    } else {
      const j1 = (hashStr(uid + 'x') - 0.5) * 0.16;
      const t0 = clamp(w * 0.52 + j1, 0, 0.62);
      const t1 = Math.min(1, t0 + 0.38);
      p = smoothstep(clamp((g - t0) / (t1 - t0), 0, 1));
    }
  }
  if (p >= 0.9999) {
    return { votes: target, total: totTarget, pct: 1, targetTotal: totTarget };
  }
  if (p <= 0 || totTarget === 0) {
    return { votes: target.map(() => 0), total: 0, pct: 0, targetTotal: totTarget };
  }
  const n = target.length;
  const counted = new Array(n);
  if (state.sim.curve === 'realistic' && n >= 2 && (r.localProg === null || r.localProg === undefined)) {
    const sorted = target.map((v, i) => ({ v, i })).sort((a, b) => b.v - a.v);
    const i0 = sorted[0].i, i1 = sorted[1].i;
    const tiltDir = (hashStr(uid + 'tilt') > 0.42) ? 1 : -1;
    const shift = (1 - p) * 0.14 * tiltDir;
    const shares = target.map(v => v / totTarget);
    shares[i0] = clamp(shares[i0] - shift, 0.01, 0.98);
    shares[i1] = clamp(shares[i1] + shift, 0.01, 0.98);
    const ssum = shares.reduce((a, b) => a + b, 0);
    const cTot = Math.round(totTarget * p);
    for (let j = 0; j < n; j++) counted[j] = Math.round(cTot * (shares[j] / ssum));
    return { votes: counted, total: counted.reduce((a, b) => a + b, 0), pct: p, targetTotal: totTarget };
  }
  for (let j = 0; j < n; j++) counted[j] = Math.round(target[j] * p);
  return { votes: counted, total: counted.reduce((a, b) => a + b, 0), pct: p, targetTotal: totTarget };
}

function allocateLargestRemainder(weights, totalSeats) {
  const n = weights.length;
  const out = new Array(n).fill(0);
  const sumW = weights.reduce((a, b) => a + b, 0);
  if (sumW <= 0 || totalSeats <= 0) return out;
  const rem = weights.map((w, i) => {
    const exact = (w / sumW) * totalSeats;
    const fl = Math.floor(exact);
    out[i] = fl;
    return { i, frac: exact - fl };
  });
  let left = totalSeats - out.reduce((a, b) => a + b, 0);
  rem.sort((a, b) => b.frac - a.frac);
  for (let k = 0; k < left && k < n; k++) out[rem[k].i]++;
  return out;
}

function computeAllResults() {
  const sc = state.scenario;
  const n = sc.parties.length;
  const regData = {};
  const natVotes = new Array(n).fill(0);
  const natSeats = new Array(n).fill(0);
  const regWins = new Array(n).fill(0);
  let totalTargetVotes = 0;
  let totalCountedVotes = 0;
  let totalTargetWeighted = 0;
  let totalCountedWeighted = 0;
  let totalBn = 0;
  let totalAbs = 0;

  Object.keys(sc.regions).forEach(uid => {
    const r = sc.regions[uid];
    const cr = getCountedRegion(uid);
    totalTargetVotes += cr.targetTotal;
    totalCountedVotes += cr.total;
    totalTargetWeighted += Math.max(1, cr.targetTotal);
    totalCountedWeighted += cr.pct * Math.max(1, cr.targetTotal);
    totalBn += Math.round((r.bn || 0) * cr.pct);
    totalAbs += Math.round((r.abs || 0) * cr.pct);

    let winIdx = -1, maxV = -1, secondV = -1;
    for (let j = 0; j < n; j++) {
      natVotes[j] += cr.votes[j];
      if (cr.votes[j] > maxV) {
        secondV = maxV;
        maxV = cr.votes[j];
        winIdx = j;
      } else if (cr.votes[j] > secondV) {
        secondV = cr.votes[j];
      }
    }
    if (cr.total <= 0) winIdx = -1;
    const marginPct = (cr.total > 0 && winIdx >= 0) ? ((maxV - Math.max(0, secondV)) / cr.total) * 100 : 0;
    if (winIdx >= 0) regWins[winIdx]++;

    const regSeats = new Array(n).fill(0);
    if (cr.total > 0 && r.seats > 0) {
      if (sc.system === 'electoral') {
        if (sc.meNeSplit && sc.map === 'usa' && (uid === 'ME' || uid === 'NE') && marginPct < 22) {
          const sorted = cr.votes.map((v, i) => ({ v, i })).sort((a, b) => b.v - a.v);
          regSeats[sorted[0].i] = r.seats - 1;
          regSeats[sorted[1].i] = 1;
        } else if (winIdx >= 0) {
          regSeats[winIdx] = r.seats;
        }
      } else if (sc.system === 'fptp_regional') {
        const origR = state.origBaseline && state.origBaseline.regions[uid];
        const canUseBase = r.baseSeats && r.baseSeats.length === n && origR && origR.votes.length === n;
        const origTot = canUseBase ? origR.votes.reduce((a, b) => a + b, 0) : 0;
        if (canUseBase && origTot > 0 && r.seats === r.baseSeats.reduce((a, b) => a + b, 0)) {
          let delta = 0;
          for (let j = 0; j < n; j++) {
            delta += Math.abs((cr.votes[j] / cr.total) - (origR.votes[j] / origTot));
          }
          delta *= 0.5;
          if (delta < 0.0005) {
            for (let j = 0; j < n; j++) regSeats[j] = r.baseSeats[j];
          } else {
            const cubeW = cr.votes.map(v => Math.pow(v / cr.total, 2.35));
            const cubeAlloc = allocateLargestRemainder(cubeW, r.seats);
            const alpha = clamp(delta * 2.4, 0, 1);
            const blendW = r.baseSeats.map((bs, j) => (1 - alpha) * bs + alpha * cubeAlloc[j]);
            const fin = allocateLargestRemainder(blendW, r.seats);
            for (let j = 0; j < n; j++) regSeats[j] = fin[j];
          }
        } else {
          const cubeW = cr.votes.map(v => Math.pow(v / cr.total, 2.35));
          const fin = allocateLargestRemainder(cubeW, r.seats);
          for (let j = 0; j < n; j++) regSeats[j] = fin[j];
        }
      }
      if (sc.system === 'electoral' || sc.system === 'fptp_regional') {
        for (let j = 0; j < n; j++) natSeats[j] += regSeats[j];
      }
    }
    const solidProj = cr.pct >= 0.999 || (cr.pct >= 0.25 && (marginPct * cr.pct) > 1.8);
    regData[uid] = { votes: cr.votes, total: cr.total, targetTotal: cr.targetTotal, pct: cr.pct, winIdx, marginPct, seats: r.seats, regSeats, solidProj };
  });

  if (sc.system === 'pr_threshold' || sc.system === 'pr_dhondt') {
    if (totalCountedVotes > 0) {
      let remSeats = sc.totalSeats || 100;
      if (sc.exemptParty !== undefined && sc.exemptSeats && natVotes[sc.exemptParty] > 0) {
        const exIdx = clamp(sc.exemptParty, 0, n - 1);
        natSeats[exIdx] += sc.exemptSeats;
        remSeats = Math.max(0, remSeats - sc.exemptSeats);
      }
      const thresh = sc.system === 'pr_threshold' ? (sc.thresholdPct || 5) : 0;
      const nonT = new Set(sc.nonThresholdParties || []);
      const eligible = natVotes.map((v, j) => {
        if (nonT.has(j)) return false;
        return ((v / totalCountedVotes) * 100) >= thresh;
      });
      const anyElig = eligible.some(Boolean);
      for (let s = 0; s < remSeats; s++) {
        let best = -1, bestScore = -1;
        for (let j = 0; j < n; j++) {
          if (anyElig && !eligible[j]) continue;
          const div = sc.system === 'pr_threshold' ? (2 * natSeats[j] + 1) : (natSeats[j] + 1);
          const score = natVotes[j] / div;
          if (score > bestScore) { bestScore = score; best = j; }
        }
        if (best >= 0) natSeats[best]++;
      }
    }
  } else if (sc.system === 'popular') {
    for (let j = 0; j < n; j++) natSeats[j] = regWins[j];
  }

  const overallPct = totalTargetWeighted > 0 ? (totalCountedWeighted / totalTargetWeighted) : 0;
  return { regData, natVotes, natSeats, regWins, totalCountedVotes, totalTargetVotes, totalBn, totalAbs, overallPct };
}

function updateLiveEvents(res) {
  if (state.sim.progress <= 0) return;
  const sc = state.scenario;
  const prev = state.sim.prevWinners;
  const called = state.sim.calledUnits;
  const mapUnits = MAPS[state.mapId].units;
  let added = false;

  Object.keys(res.regData).forEach(uid => {
    const rd = res.regData[uid];
    if (rd.total <= 0 || rd.winIdx < 0) return;
    const oldW = prev[uid];
    const uObj = mapUnits.find(x => x.id === uid);
    const uname = uObj ? uObj.name : uid;
    const pname = sc.parties[rd.winIdx].short;
    if (oldW !== undefined && oldW !== -1 && oldW !== rd.winIdx) {
      state.sim.events.unshift({
        type: 'flip',
        pct: Math.round(res.overallPct * 100),
        text: uname + ' ' + t('flipped') + ' ' + pname + ' (' + Math.round(rd.pct * 100) + '%)'
      });
      const el = pathById[uid];
      if (el) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
      added = true;
    }
    prev[uid] = rd.winIdx;

    if (!called[uid] && rd.solidProj && rd.pct >= 0.35 && state.sim.running) {
      called[uid] = true;
      state.sim.events.unshift({
        type: 'call',
        pct: Math.round(res.overallPct * 100),
        text: t('projected') + ': ' + uname + ' -> ' + pname + (rd.seats > 1 ? ' (+' + rd.seats + ')' : '')
      });
      added = true;
    }
  });

  if (!state.sim.majorityCalled && state.sim.running && res.overallPct > 0.35) {
    const metric = sc.system === 'popular' ? res.natVotes : res.natSeats;
    const totM = sc.system === 'popular' ? res.totalCountedVotes : (sc.totalSeats || metric.reduce((a, b) => a + b, 0));
    const targetM = sc.system === 'popular' ? totM * ((sc.majorityPct || 50) / 100) : (sc.majoritySeats || Math.floor(totM / 2) + 1);
    const winJ = metric.findIndex(v => v >= targetM);
    if (winJ >= 0 && res.overallPct >= 0.65) {
      state.sim.majorityCalled = true;
      state.sim.events.unshift({
        type: 'call',
        pct: Math.round(res.overallPct * 100),
        text: t('majorityHit') + ' ' + sc.parties[winJ].name
      });
      added = true;
    }
  }
  if (state.sim.events.length > 45) state.sim.events.length = 45;
  if (added || state.sim.events.length === 0) renderEventLog();
}

function renderEventLog() {
  const el = document.getElementById('eventLog');
  document.getElementById('logCount').textContent = state.sim.events.length;
  el.innerHTML = state.sim.events.map(ev =>
    '<div class="ev-item ' + (ev.type === 'flip' ? 'ev-flip' : 'ev-call') + '"><span>' + ev.text + '</span><span class="num" style="color:var(--text-dim);">' + ev.pct + '%</span></div>'
  ).join('');
}

function updateAll() {
  const res = computeAllResults();
  updateLiveEvents(res);
  renderScoreboard(res);
  renderMapColors(res);
  renderHemicycle(res);
  renderRegionEditor(res);
  renderTable(res);
  renderSimControls(res);
}

function renderScoreboard(res) {
  const sc = state.scenario;
  document.getElementById('raceTitle').textContent = state.lang === 'pt' ? sc.name : (sc.nameEn || sc.name);
  const sysNames = {
    popular: state.lang === 'pt' ? 'Voto Popular' : 'Popular Vote',
    electoral: state.lang === 'pt' ? 'Colégio Eleitoral' : 'Electoral College',
    fptp_regional: state.lang === 'pt' ? 'Distrital / Misto' : 'Regional FPTP / Mixed',
    pr_threshold: state.lang === 'pt' ? 'Prop. Sainte-Laguë' : 'PR Sainte-Laguë',
    pr_dhondt: "D'Hondt"
  };
  document.getElementById('systemBadge').textContent = sysNames[sc.system] || sc.system;
  const st = document.getElementById('statusBadge');
  if (state.sim.running) {
    st.className = 'badge live';
    st.innerHTML = '<span class="dot-pulse"></span><span>' + t('counting') + '</span>';
  } else if (res.overallPct >= 0.999 && res.totalCountedVotes > 0) {
    st.className = 'badge done';
    st.textContent = t('finished');
  } else {
    st.className = 'badge';
    st.textContent = t('waiting');
  }

  let metaHtml = '<span>' + t('counted') + ': <strong class="num">' + fmtPct(res.overallPct * 100) + '</strong></span>' +
    '<span>' + t('validVotes') + ': <strong class="num">' + fmtInt(res.totalCountedVotes) + '</strong></span>';
  if (res.totalBn > 0) metaHtml += '<span>' + t('blankNull') + ': <strong class="num">' + fmtInt(res.totalBn) + '</strong></span>';
  if (res.totalAbs > 0) metaHtml += '<span>' + t('abstentions') + ': <strong class="num">' + fmtInt(res.totalAbs) + '</strong></span>';
  if (sc.system !== 'popular') {
    const maj = sc.majoritySeats || (Math.floor((sc.totalSeats || 100) / 2) + 1);
    metaHtml += '<span>' + t('majority') + ': <strong class="num">' + maj + ' / ' + (sc.totalSeats || 100) + '</strong></span>';
  }
  document.getElementById('scoreMeta').innerHTML = metaHtml;

  const order = sc.parties.map((p, i) => ({
    i, p, v: res.natVotes[i], s: res.natSeats[i],
    key: sc.system === 'popular' ? res.natVotes[i] : (res.natSeats[i] * 1e12 + res.natVotes[i])
  })).sort((a, b) => b.key - a.key);

  const cards = document.getElementById('partyCards');
  cards.innerHTML = order.map((item, rank) => {
    const pct = res.totalCountedVotes > 0 ? (item.v / res.totalCountedVotes) * 100 : 0;
    const isWin = rank === 0 && res.totalCountedVotes > 0;
    const bigVal = sc.system === 'popular' ? fmtPct(pct) : (fmtInt(item.s) + ' ' + (sc.unitSeatLabel || ''));
    const subLeft = sc.system === 'popular' ? (fmtInt(item.v) + ' v') : (fmtPct(pct) + ' · ' + fmtInt(item.v));
    const subRight = sc.system === 'popular' ? (item.s + ' ' + (sc.unitSeatLabel || 'reg.')) : '';
    return '<div class="p-card' + (isWin ? ' winner' : '') + '">' +
      '<div class="p-stripe" style="background:' + item.p.color + ';"></div>' +
      '<div class="p-head"><span class="p-name">' + item.p.name + '</span><span class="p-tag" style="background:' + item.p.color + ';">' + item.p.short + '</span></div>' +
      '<div class="p-main"><span class="p-big num">' + bigVal + '</span><span class="p-sub num">' + subLeft + '</span></div>' +
      (subRight ? '<div class="p-sub num" style="padding-left:6px;">' + subRight + '</div>' : '') +
      '</div>';
  }).join('');

  const track = document.getElementById('overallTrack');
  const denom = sc.system === 'popular' ? res.totalCountedVotes : (sc.totalSeats || res.natSeats.reduce((a, b) => a + b, 0));
  let segs = '';
  if (denom > 0) {
    order.forEach(item => {
      const val = sc.system === 'popular' ? item.v : item.s;
      const w = (val / denom) * 100;
      if (w > 0) segs += '<div class="progress-seg" style="width:' + w.toFixed(3) + '%;background:' + item.p.color + ';"></div>';
    });
  }
  const threshPos = sc.system === 'popular' ? (sc.majorityPct || 50) : ((sc.majoritySeats || Math.floor((sc.totalSeats || 100) / 2) + 1) / Math.max(1, sc.totalSeats || 100)) * 100;
  segs += '<div class="thresh-line" style="left:' + clamp(threshPos, 1, 99) + '%;"></div>';
  track.innerHTML = segs;
}

function renderMapColors(res) {
  const sc = state.scenario;
  const uncountedHex = state.theme === 'dark' ? '#1e293b' : '#cbd5e1';
  const bgBlend = state.theme === 'dark' ? '#151f32' : '#e2e8f0';
  let maxRegVol = 1;
  Object.values(res.regData).forEach(r => { if (r.total > maxRegVol) maxRegVol = r.total; });

  MAPS[state.mapId].units.forEach(u => {
    const rd = res.regData[u.id];
    const path = pathById[u.id];
    const callout = calloutById[u.id];
    const lbl = labelById[u.id];
    let fill = uncountedHex;
    if (rd && rd.total > 0 && rd.winIdx >= 0) {
      const pColor = sc.parties[rd.winIdx].color;
      if (state.colorMode === 'solid') {
        fill = pColor;
      } else if (state.colorMode === 'turnout') {
        const logF = Math.log10(rd.total + 10) / Math.log10(maxRegVol + 10);
        fill = blendColor('#06b6d4', clamp(logF, 0.2, 1), bgBlend);
      } else {
        const strength = clamp(0.38 + (rd.marginPct / 26) * 0.62, 0.38, 1);
        fill = blendColor(pColor, strength, bgBlend);
      }
    }
    if (path) {
      path.setAttribute('fill', fill);
      path.classList.toggle('selected', u.id === state.selectedUnit);
    }
    if (callout) {

    }

  ).join('') + (state.colorMode === 'margin' ? '<span style="opacity:0.7;">(' + (state.lang === 'pt' ? 'tom = margem' : 'shade = margin') + ')</span>' : '');
}

function renderHemicycle(res) {
  const wrap = document.getElementById('hemiWrap');
  const sc = state.scenario;
  if (sc.system === 'popular' && sc.map === 'world') {
    wrap.style.display = 'none';
    return;
  }
  wrap.style.display = 'flex';
  const totalSeats = sc.system === 'popular' ? (sc.totalSeats || MAPS[state.mapId].units.length) : (sc.totalSeats || res.natSeats.reduce((a, b) => a + b, 0));
  const svg = document.getElementById('hemiSvg');
  svg.innerHTML = '';

  const dots = [];
  const rows = totalSeats <= 40 ? 2 : totalSeats <= 160 ? 4 : totalSeats <= 420 ? 6 : 8;
  const rMin = 36, rMax = 94;
  let perRow = [];
  let sumR = 0;
  for (let row = 0; row < rows; row++) {
    const rad = rMin + (rMax - rMin) * (row / Math.max(1, rows - 1));
    sumR += rad;
    perRow.push({ rad });
  }
  let assigned = 0;
  perRow.forEach((rw, idx) => {
    rw.count = idx === rows - 1 ? (totalSeats - assigned) : Math.round((rw.rad / sumR) * totalSeats);
    assigned += rw.count;
  });
  perRow.forEach(rw => {
    for (let k = 0; k < rw.count; k++) {
      const ang = Math.PI - (rw.count === 1 ? Math.PI / 2 : (k / (rw.count - 1)) * Math.PI);
      const x = 105 + rw.rad * Math.cos(ang);
      const y = 100 - rw.rad * Math.sin(ang);
      dots.push({ x, y, ang });
    }
  });
  dots.sort((a, b) => b.ang - a.ang);

  const seatColors = [];
  const partyOrder = sc.parties.map((p, i) => ({ p, i, s: res.natSeats[i] })).sort((a, b) => b.s - a.s);
  partyOrder.forEach(item => {
    for (let k = 0; k < item.s; k++) seatColors.push(item.p.color);
  });
  while (seatColors.length < dots.length) seatColors.push(state.theme === 'dark' ? '#334155' : '#cbd5e1');

  const dotR = totalSeats > 450 ? 2.1 : totalSeats > 250 ? 2.8 : totalSeats > 100 ? 3.5 : 5.2;
  dots.forEach((d, idx) => {
    const c = document.createElementNS(SVG_NS, 'circle');
    c.setAttribute('cx', d.x.toFixed(1));
    c.setAttribute('cy', d.y.toFixed(1));
    c.setAttribute('r', dotR);
    c.setAttribute('fill', seatColors[idx]);
    svg.appendChild(c);
  });

  document.getElementById('hemiTitle').textContent = sc.system === 'popular'
    ? (state.lang === 'pt' ? 'Regiões Vencidas (' + totalSeats + ')' : 'Regions Won (' + totalSeats + ')')
    : (state.lang === 'pt' ? 'Composição (' + totalSeats + ' ' + (sc.unitSeatLabel || '') + ')' : 'Chamber (' + totalSeats + ' ' + (sc.unitSeatLabel || '') + ')');
  const maj = sc.system === 'popular' ? (Math.floor(totalSeats / 2) + 1) : (sc.majoritySeats || Math.floor(totalSeats / 2) + 1);
  document.getElementById('hemiSub').textContent = t('majority') + ': ' + maj;
  document.getElementById('hemiBreakdown').innerHTML = partyOrder.filter(x => x.s > 0).map(x =>
    '<span style="display:inline-flex;align-items:center;gap:4px;"><span class="swatch" style="background:' + x.p.color + ';"></span><strong>' + x.p.short + '</strong> <span class="num">' + x.s + '</span></span>'
  ).join('');
}

let dragInfo = null;
let paintingNow = false;
function onUnitPointerDown(uid, ev) {
  ev.stopPropagation();
  if (state.tool === 'paint') {
    paintingNow = true;
    applyPaintToUnit(uid);
    return;
  }
  dragInfo = { uid, x: ev.clientX, y: ev.clientY, tx: state.zoom.tx, ty: state.zoom.ty, moved: false };
}

function applyPaintToUnit(uid) {
  const r = state.scenario.regions[uid];
  if (!r) return;
  const n = state.scenario.parties.length;
  const idx = clamp(state.paintPartyIdx, 0, n - 1);
  let tot = r.votes.reduce((a, b) => a + b, 0);
  if (tot <= 0) tot = Math.max(10000, (r.seats || 1) * 100000);

  if (state.paintMode === 'boost') {
    const add = Math.round(tot * 0.10);
    const rem = Math.max(0, tot - r.votes[idx]);
    r.votes[idx] = Math.min(tot, r.votes[idx] + add);
    const newRem = tot - r.votes[idx];
    for (let j = 0; j < n; j++) {
      if (j !== idx) r.votes[j] = rem > 0 ? Math.round(r.votes[j] * (newRem / rem)) : Math.round(newRem / Math.max(1, n - 1));
    }
  } else {
    const share = state.paintMode === 'landslide' ? 0.80 : 0.65;
    const winV = Math.round(tot * share);
    const rest = tot - winV;
    const oldRest = tot - r.votes[idx];
    for (let j = 0; j < n; j++) {
      if (j === idx) r.votes[j] = winV;
      else if (oldRest > 0) r.votes[j] = Math.round(r.votes[j] * (rest / oldRest));
      else r.votes[j] = Math.round(rest / Math.max(1, n - 1));
    }
  }
  const diff = tot - r.votes.reduce((a, b) => a + b, 0);
  if (state.sim.progress < 0.05) r.localProg = 1;
  r.votes[idx] = Math.max(0, r.votes[idx] + diff);
  state.selectedUnit = uid;
  updateAll();
  if (hoverId === uid) updateTooltipContent(uid);
}

function setupMapPanZoom() {
  const vp = document.getElementById('mapViewport');
  vp.addEventListener('pointerdown', ev => {
    if (state.tool === 'paint') { paintingNow = true; return; }
    dragInfo = { uid: null, x: ev.clientX, y: ev.clientY, tx: state.zoom.tx, ty: state.zoom.ty, moved: false };
  });
  window.addEventListener('pointermove', ev => {
    if (paintingNow && state.tool === 'paint') {
      const tgt = document.elementFromPoint(ev.clientX, ev.clientY);
      const id = tgt && tgt.dataset && tgt.dataset.id;
      if (id) applyPaintToUnit(id);
      return;
    }
    if (!dragInfo) return;
    const dx = ev.clientX - dragInfo.x;
    const dy = ev.clientY - dragInfo.y;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) dragInfo.moved = true;
    if (dragInfo.moved) {
      const rect = vp.getBoundingClientRect();
      const scaleX = 960 / Math.max(1, rect.width);
      state.zoom.tx = dragInfo.tx + dx * scaleX;
      state.zoom.ty = dragInfo.ty + dy * scaleX;
      applyZoomTransform();
    }
  });
  window.addEventListener('pointerup', () => {
    paintingNow = false;
    if (dragInfo && !dragInfo.moved && dragInfo.uid) {
      state.selectedUnit = dragInfo.uid;
      updateAll();
      if (document.getElementById('tabEdit').style.display !== 'none') {
        document.getElementById('regionJumpSelect').value = state.selectedUnit;
      }
    }
    dragInfo = null;
  });
  vp.addEventListener('wheel', ev => {
    ev.preventDefault();
    const factor = ev.deltaY < 0 ? 1.15 : 0.87;
    zoomBy(factor, ev.clientX, ev.clientY);
  }, { passive: false });
}

function zoomBy(factor, cx, cy) {
  const vp = document.getElementById('mapViewport');
  const rect = vp.getBoundingClientRect();
  const oldS = state.zoom.scale;
  const newS = clamp(oldS * factor, 1, 10);
  if (cx !== undefined && cy !== undefined) {
    const px = ((cx - rect.left) / rect.width) * 960;
    const py = ((cy - rect.top) / rect.height) * 600;
    state.zoom.tx = px - (px - state.zoom.tx) * (newS / oldS);
    state.zoom.ty = py - (py - state.zoom.ty) * (newS / oldS);
  }
  state.zoom.scale = newS;
  if (newS === 1) { state.zoom.tx = 0; state.zoom.ty = 0; }
  applyZoomTransform();
}
function resetZoom() {
  state.zoom = { scale: 1, tx: 0, ty: 0 };
  applyZoomTransform();
}
function applyZoomTransform() {
  const g = document.getElementById('mapPanGroup');
  if (g) g.setAttribute('transform', 'translate(' + state.zoom.tx.toFixed(1) + ',' + state.zoom.ty.toFixed(1) + ') scale(' + state.zoom.scale.toFixed(3) + ')');
}

function startSimFromZero() {
  stopSim();
  Object.values(state.scenario.regions).forEach(r => { r.localProg = null; });
  state.sim.progress = 0;
  state.sim.prevWinners = {};
  state.sim.calledUnits = {};
  state.sim.majorityCalled = false;
  state.sim.events = [];
  renderEventLog();
  state.sim.running = true;
  state.sim.lastTick = performance.now();
  state.sim.raf = requestAnimationFrame(simTick);
  updateAll();
}
function toggleSim() {
  if (state.sim.running) {
    stopSim();
    updateAll();
  } else {
    if (state.sim.progress >= 0.999) state.sim.progress = 0;
    state.sim.running = true;
    state.sim.lastTick = performance.now();
    state.sim.raf = requestAnimationFrame(simTick);
    updateAll();
  }
}
function stopSim() {
  state.sim.running = false;
  if (state.sim.raf) cancelAnimationFrame(state.sim.raf);
  state.sim.raf = null;
}
function simTick(now) {
  if (!state.sim.running) return;
  const dt = Math.min(0.1, (now - state.sim.lastTick) / 1000);
  state.sim.lastTick = now;
  const step = (dt * state.sim.speed) / Math.max(2, state.sim.durationSec);
  state.sim.progress = Math.min(1, state.sim.progress + step);
  updateAll();
  if (state.sim.progress >= 1) {
    stopSim();
    updateAll();
  } else {
    state.sim.raf = requestAnimationFrame(simTick);
  }
}
function renderSimControls(res) {
  document.getElementById('simPctText').textContent = fmtPct(res.overallPct * 100);
  document.getElementById('simScrub').value = Math.round(state.sim.progress * 1000);

}

  document.getElementById('btnResetPreset').addEventListener('click', () => {
    const cat = CATALOG.find(c => c.id === state.mapId);
    const id = state.presetId === '__blank__' ? cat.defaultPreset : state.presetId;
    loadPreset(id);
    document.getElementById('presetSelect').value = id;
  });
  document.getElementById('btnLang').addEventListener('click', () => {
    state.lang = state.lang === 'pt' ? 'en' : 'pt';
    applyTranslations();
  });
  document.getElementById('btnTheme').addEventListener('click', () => {
    state.theme = state.theme === 'dark' ? 'light' : 'dark';
    document.body.classList.toggle('light', state.theme === 'light');
    updateAll();
  });

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      ['sim', 'edit', 'table', 'parties'].forEach(tb => {
        document.getElementById('tab' + tb.charAt(0).toUpperCase() + tb.slice(1)).style.display = (tb === btn.dataset.tab) ? 'flex' : 'none';
      });
    });
  });

  document.getElementById('toolInspect').addEventListener('click', () => {
    state.tool = 'inspect';
    document.getElementById('toolInspect').classList.add('active');
    document.getElementById('toolPaint').classList.remove('active');
    document.getElementById('paintPartySelect').style.display = 'none';
    document.getElementById('paintModeSelect').style.display = 'none';
  });
  document.getElementById('toolPaint').addEventListener('click', () => {
    state.tool = 'paint';
    document.getElementById('toolPaint').classList.add('active');
    document.getElementById('toolInspect').classList.remove('active');
    document.getElementById('paintPartySelect').style.display = '';
    document.getElementById('paintModeSelect').style.display = '';
  });
  document.getElementById('paintPartySelect').addEventListener('change', e => { state.paintPartyIdx = parseInt(e.target.value, 10); });
  document.getElementById('paintModeSelect').addEventListener('change', e => { state.paintMode = e.target.value; });

  document.getElementById('colorModeSelect').addEventListener('change', e => { state.colorMode = e.target.value; updateAll(); });
  document.getElementById('btnLabels').addEventListener('click', e => {
    state.showLabels = !state.showLabels;
    e.target.classList.toggle('active', state.showLabels);
    updateAll();
  });
  document.getElementById('btnZoomIn').addEventListener('click', () => zoomBy(1.35));
  document.getElementById('btnZoomOut').addEventListener('click', () => zoomBy(0.74));
  document.getElementById('btnZoomReset').addEventListener('click', () => resetZoom());

  document.getElementById('swingPartySelect').addEventListener('change', e => {
    state.swingPartyIdx = parseInt(e.target.value, 10);
    updateAll();
  });
  document.getElementById('swingSlider').addEventListener('input', e => {
    state.swingDelta = parseFloat(e.target.value);
    document.getElementById('swingValLabel').textContent = (state.swingDelta >= 0 ? '+' : '') + state.swingDelta.toFixed(1) + '%';
    updateAll();
  });
  document.getElementById('btnApplySwing').addEventListener('click', () => {
    Object.keys(state.scenario.regions).forEach(uid => {
      state.scenario.regions[uid].votes = getEffectiveTargetVotes(uid);
    });
    state.swingDelta = 0;
    document.getElementById('swingSlider').value = 0;
    document.getElementById('swingValLabel').textContent = '+0.0%';
    updateAll();
  });
  document.getElementById('btnResetSwing').addEventListener('click', () => {
    state.swingDelta = 0;
    document.getElementById('swingSlider').value = 0;
    document.getElementById('swingValLabel').textContent = '+0.0%';
    updateAll();
  });

  document.getElementById('btnSimStart').addEventListener('click', () => startSimFromZero());
  document.getElementById('btnSimToggle').addEventListener('click', () => toggleSim());
  document.getElementById('btnSimZero').addEventListener('click', () => {
    stopSim();
    Object.values(state.scenario.regions).forEach(r => { r.localProg = null; });
    state.sim.progress = 0; state.sim.events = []; state.sim.prevWinners = {}; state.sim.calledUnits = {}; state.sim.majorityCalled = false;
    renderEventLog();
    updateAll();
  });
  document.getElementById('btnSimDone').addEventListener('click', () => {
    stopSim();
    Object.values(state.scenario.regions).forEach(r => { r.localProg = null; });
    state.sim.progress = 1;
    updateAll();
  });
  document.getElementById('simScrub').addEventListener('input', e => {
    stopSim();
    Object.values(state.scenario.regions).forEach(r => { r.localProg = null; });
    state.sim.progress = parseInt(e.target.value, 10) / 1000;
    updateAll();
  });
  document.getElementById('simDurPreset').addEventListener('change', e => {
    state.sim.durationSec = parseInt(e.target.value, 10);
    document.getElementById('simDurCustom').value = state.sim.durationSec;
  });
  document.getElementById('simDurCustom').addEventListener('change', e => {
    state.sim.durationSec = clamp(parseInt(e.target.value, 10) || 30, 3, 3600);
  });
  document.getElementById('simSpeedSelect').addEventListener('change', e => {
    state.sim.speed = parseFloat(e.target.value) || 1;
  });
  document.getElementById('simCurveSelect').addEventListener('change', e => {
    state.sim.curve = e.target.value;
    updateAll();
  });

  document.getElementById('regionJumpSelect').addEventListener('change', e => {
    state.selectedUnit = e.target.value;
    updateAll();
  });
  document.getElementById('editRegionSeats').addEventListener('change', e => {
    state.scenario.regions[state.selectedUnit].seats = Math.max(0, parseInt(e.target.value, 10) || 0);
    state.scenario.totalSeats = Object.values(state.scenario.regions).reduce((a, r) => a + (r.seats || 0), 0);
    updateAll();
  });
  document.getElementById('editRegionBn').addEventListener('change', e => {
    state.scenario.regions[state.selectedUnit].bn = Math.max(0, parseInt(e.target.value, 10) || 0);
    updateAll();
  });
  document.getElementById('editRegionAbs').addEventListener('change', e => {
    state.scenario.regions[state.selectedUnit].abs = Math.max(0, parseInt(e.target.value, 10) || 0);
    updateAll();
  });
  document.getElementById('editRegionProg').addEventListener('change', e => {
    state.scenario.regions[state.selectedUnit].localProg = clamp((parseFloat(e.target.value) || 0) / 100, 0, 1);
    updateAll();
  });
  document.getElementById('btnZeroRegion').addEventListener('click', () => {
    const r = state.scenario.regions[state.selectedUnit];
    r.votes = r.votes.map(() => 0);
    updateAll();
  });

  document.getElementById('tableSearch').addEventListener('input', e => {
    state.tableFilter = e.target.value;
    updateAll();
  });
  document.querySelectorAll('.data-tbl th').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.sort;
      if (state.tableSort.col === col) state.tableSort.dir *= -1;
      else { state.tableSort.col = col; state.tableSort.dir = col === 'name' || col === 'leader' ? 1 : -1; }
      updateAll();
    });
  });

  document.getElementById('cfgRaceTitle').addEventListener('change', e => {
    if (state.lang === 'pt') state.scenario.name = e.target.value;
    else state.scenario.nameEn = e.target.value;
    updateAll();
  });
  document.getElementById('cfgSystem').addEventListener('change', e => {
    state.scenario.system = e.target.value;
    syncControlsToScenario();
    updateAll();
  });
  document.getElementById('cfgThresh').addEventListener('change', e => {
    const val = parseFloat(e.target.value) || 0;
    if (state.scenario.system === 'pr_threshold') state.scenario.thresholdPct = val;
    else if (state.scenario.system === 'popular') state.scenario.majorityPct = val;
    else state.scenario.majoritySeats = Math.round(val);
    updateAll();
  });
  document.getElementById('cfgMeNeSplit').addEventListener('change', e => {
    state.scenario.meNeSplit = e.target.checked;
    updateAll();
  });
  document.getElementById('btnAddParty').addEventListener('click', () => {
    if (state.scenario.parties.length >= 12) return;
    const palette = ['#8B5CF6', '#EC4899', '#14B8A6', '#F97316', '#84CC16', '#6366F1', '#EF4444', '#0EA5E9'];
    const idx = state.scenario.parties.length;
    state.scenario.parties.push({
      id: 'p' + Date.now(),
      name: (state.lang === 'pt' ? 'Partido ' : 'Party ') + (idx + 1),
      short: 'P' + (idx + 1),
      color: palette[idx % palette.length]
    });
    Object.values(state.scenario.regions).forEach(r => {
      r.votes.push(0);
      if (r.baseSeats) r.baseSeats.push(0);
    });
    syncControlsToScenario();
    updateAll();
  });

  document.getElementById('btnIoModal').addEventListener('click', () => {
    document.getElementById('ioTextarea').value = JSON.stringify(state.scenario, null, 2);
    document.getElementById('ioModal').classList.add('open');
  });
  document.getElementById('btnCloseIo').addEventListener('click', () => {
    document.getElementById('ioModal').classList.remove('open');
  });
  document.getElementById('btnCopyJson').addEventListener('click', () => {
    const ta = document.getElementById('ioTextarea');
    ta.select();
    if (navigator.clipboard) navigator.clipboard.writeText(ta.value);
  });
  document.getElementById('btnDownloadJson').addEventListener('click', () => {
    const blob = new Blob([document.getElementById('ioTextarea').value], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (state.scenario.id || 'election') + '.json';
    a.click();
  });
  document.getElementById('btnImportJson').addEventListener('click', () => {
    try {
      const obj = JSON.parse(document.getElementById('ioTextarea').value);
      if (!obj || !obj.map || !MAPS[obj.map] || !Array.isArray(obj.parties) || !obj.regions) throw new Error('Invalid');
      state.mapId = obj.map;
      state.scenario = obj;
      state.origBaseline = cloneObj(obj);
      state.selectedUnit = MAPS[state.mapId].units[0].id;
      document.getElementById('ioModal').classList.remove('open');
      initSelectors();
      renderMapStructure();
      syncControlsToScenario();
      updateAll();
    } catch (err) {
      alert('JSON inválido');
    }
  });
}

window.addEventListener('keydown', ev => {
  if (ev.target && ['INPUT','TEXTAREA','SELECT'].includes(ev.target.tagName)) return;
  if (ev.code === 'Space') { ev.preventDefault(); toggleSim(); }
  else if (ev.key === 'r' || ev.key === 'R') resetZoom();
  else if (ev.key === 'Escape') document.getElementById('ioModal').classList.remove('open');
});
initSelectors();
bindEvents();
setupMapPanZoom();
loadPreset(state.presetId);

</script>
</body>
</html>
